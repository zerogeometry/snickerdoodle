<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Snickerdoodle leaflet</title>
<!--
  One source for every C14 leaflet (version 2, 17 Nov 2026; why it looks like this: CREATIVE-BRIEF.md).
  build.mjs opens this file once per version, e.g. leaflet.html?size=a6&season=xmas&code=MAGICFAIR&qr=fair,
  and prints a 2-page PDF (front, back) at trim + 3 mm bleed. Add &proof for the trim (pink) and safe (blue) lines.

  The look follows the approved social posts in brand-assets/social: kraft doodle paper, one big picture,
  one sentence-case headline, a handwritten paper tag, one tomato pill. Tokens from src/app/globals.css.
  Bricolage Grotesque (static weights in fonts/) + Gaegu 700 for ONE handwritten moment per side.
  Tabler icons inlined by build.mjs. Every image is a brand sample: no children, no faces, no real names.
  Audience: GROWN-UPS ONLY. Nothing asks a child to do anything.
-->
<style>
  :root {
    --oat: #F8F5E9; --paper: #FFFBF2; --line: #D9C7A9; --cocoa: #2B2118; --ink-soft: #5A4A3A;
    --tomato: #C8402A; --honey: #F6C445; --honey-band: #FBE9B7; --sky: #8FB5D6; --berry: #E8786E; --leaf: #7FA65E;
    --bleed: 3mm;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #888; }
  body { font-family: 'Bricolage', sans-serif; color: var(--cocoa); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  @page { margin: 0; }
  .side { position: relative; overflow: hidden; page-break-after: always; break-after: page; }
  .side:last-child { page-break-after: auto; break-after: auto; }
  body.a6 .side { width: 111mm; height: 154mm; }
  body.a5 .side { width: 154mm; height: 216mm; }
  .front { background-color: #C9A77C; background-repeat: repeat; }
  .back { background-color: #EFE6D6; background-repeat: repeat; }
  .abs { position: absolute; }
  /* calm the doodle paper so words read over it (the social posts use it this softly) */
  .front::before, .back::before { content: ''; position: absolute; inset: 0; }
  .front::before { background: rgba(201,167,124,.42); }
  .back::before { background: rgba(248,245,233,.66); }
  .logo-tag { background: #fff; box-shadow: 0 .5mm 1.4mm rgba(43,33,24,.3); }
  .logo-tag img { display: block; width: 100%; }
  .over { z-index: 6; }

  /* type */
  h1, h2, h3 { font-weight: 800; letter-spacing: -0.025em; line-height: .98; }
  .hand { font-family: 'Gaegu', cursive; font-weight: 700; line-height: 1; }
  p { line-height: 1.28; }
  b { font-weight: 800; }

  /* pieces */
  .sheet { background: #fff; box-shadow: 0 .6mm 1.8mm rgba(43,33,24,.35); }
  .sheet img, .photo img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .photo { background: #fff; padding: 1.8mm; box-shadow: 0 .8mm 2.4mm rgba(43,33,24,.38); }
  .tape { position: absolute; height: 5mm; width: 18mm; top: -2.6mm; left: 50%; margin-left: -9mm; opacity: .9; z-index: 2;
    clip-path: polygon(0 8%, 6% 0, 12% 10%, 18% 0, 82% 0, 88% 9%, 94% 0, 100% 10%, 100% 92%, 94% 100%, 88% 90%, 82% 100%, 18% 100%, 12% 90%, 6% 100%, 0 90%); }
  .tape.honey { background: repeating-linear-gradient(45deg, #F6C445 0 1.3mm, #F8D272 1.3mm 2.6mm); }
  .tape.berry { background: repeating-linear-gradient(-45deg, #E8786E 0 1.1mm, #EE968E 1.1mm 2.2mm); }
  .tape.sky { background: repeating-linear-gradient(90deg, #8FB5D6 0 1.1mm, #A9C6E0 1.1mm 2.2mm); }
  .tag { background: #fff; padding: 1.6mm 2.6mm 1.8mm; box-shadow: 0 .5mm 1.4mm rgba(43,33,24,.3); z-index: 3; }
  .tag .t { font-family: 'Gaegu', cursive; font-weight: 700; line-height: 1; }
  .tag .s { font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-soft); margin-top: .7mm; }
  .pill { display: inline-flex; align-items: center; gap: 1.4mm; border-radius: 99px; font-weight: 800; white-space: nowrap; }
  .pill.tomato { background: var(--tomato); color: #fff; }
  .pill.ink { background: var(--cocoa); color: var(--paper); }
  .card { background: #fff; border-radius: 2.4mm; box-shadow: 0 .4mm 1.2mm rgba(43,33,24,.18); }
  .qr svg { display: block; width: 100%; height: 100%; }
  .thumb { text-align: center; }
  .thumb .im { background: #fff; padding: 1mm; box-shadow: 0 .4mm 1.1mm rgba(43,33,24,.25); }
  .thumb img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
  .thumb .cap { font-weight: 700; margin-top: 1.1mm; line-height: 1.1; }
  .thumb .cap b { color: var(--tomato); }
  .line { display: flex; align-items: center; gap: 1.6mm; font-weight: 700; }
  .line svg { flex: none; }
  .coupon { background: var(--honey-band); border: .45mm dashed var(--cocoa); border-radius: 2.4mm; display: flex; align-items: center; justify-content: space-between; }
  .coupon .code { font-weight: 800; letter-spacing: .07em; background: #fff; border: .45mm solid var(--cocoa); border-radius: 1.4mm; white-space: nowrap; }
  .smallprint { color: var(--ink-soft); line-height: 1.22; }
  .num { display: inline-grid; place-items: center; border-radius: 50%; background: var(--tomato); color: #fff; font-weight: 800; flex: none; }
  .cutout { filter: drop-shadow(0 .7mm 1.2mm rgba(43,33,24,.35)); }
  .box { background: var(--paper); border: .4mm solid var(--line); border-radius: 2.4mm; }
  .box p { display: flex; gap: 1.4mm; align-items: flex-start; color: var(--ink-soft); }
  .box p svg { flex: none; margin-top: .3mm; }

  .proofline { position: absolute; pointer-events: none; z-index: 50; }
  .proofline.trim { inset: var(--bleed); outline: .25mm solid #ff2d8a; }
  .proofline.safe { inset: calc(var(--bleed) + 5mm); outline: .25mm dashed #2f7bff; }
</style>
</head>
<body>
<main id="sheet"></main>
<script>
const q = new URLSearchParams(location.search);
const SIZE = q.get('size') === 'a5' ? 'a5' : 'a6';
const SEASON = q.get('season') === 'spring' ? 'spring' : 'xmas';
const CODE = (q.get('code') || 'MAGICFAIR').toUpperCase();
const QRNAME = q.get('qr') || 'fair';
const PROOF = q.has('proof');
document.body.className = SIZE;

const img = (name) => `img/${name}`;
const icon = (name, mm, colour = 'currentColor', stroke = 2) =>
  (window.TABLER?.[name] || '').replace('<svg', `<svg style="width:${mm}mm;height:${mm}mm;color:${colour}" stroke-width="${stroke}"`);
const proof = () => (PROOF ? '<div class="proofline trim"></div><div class="proofline safe"></div>' : '');
const qr = () => `<div class="qr" style="width:100%;height:100%">${window.QRS?.[QRNAME] || ''}</div>`;
// a hand-drawn arrow (tomato crayon), drawn in a 100 x 60 box
const arrow = (w, h, rot = 0) => `<svg viewBox="0 0 100 60" style="width:${w}mm;height:${h}mm;transform:rotate(${rot}deg)" aria-hidden="true">
  <path d="M4 14 C 30 2, 62 6, 86 38" fill="none" stroke="#C8402A" stroke-width="4.2" stroke-linecap="round"/>
  <path d="M70 36 L 88 42 L 90 22" fill="none" stroke="#C8402A" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const S = (a6, a5) => (SIZE === 'a6' ? a6 : a5); // pick a measurement by size
// the QR's promise says exactly what happens (a vendor test found wording alone moved scans ~12x)
const QR_PROMISE = SEASON === 'xmas' ? ['see their drawing', 'on a bauble'] : ['see their drawing', 'on a mug'];
const frontQr = (left, top, w, fs) => `<div class="abs card" style="left:${left}mm;top:${top}mm;width:${w}mm;padding:1.6mm 1.6mm 1.4mm;text-align:center"><div style="width:${w - 3.2}mm;height:${w - 3.2}mm">${qr()}</div><p style="font-size:${fs}pt;font-weight:800;line-height:1.1;margin-top:1mm">scan to try it</p></div>`;

// ---------- the words (brand voice: warm, plain; grown-ups only) ----------
const XMAS = SEASON === 'xmas';
const PAPER_FRONT = XMAS ? 'paper-kraft-christmas.jpg' : 'paper-kraft.jpg';
const PAPER_BACK = XMAS ? 'paper-oat-christmas.jpg' : 'paper-oat.jpg';
const LOGO = XMAS ? 'logo-christmas.png' : 'logo.png';

const SMALL = `For grown-ups. Free card: one greetings card off your first order when you're signed in and it sits beside another keepsake (a few very small baskets don't qualify; checkout always shows it). ${XMAS ? "Last order dates are our print labs'; the site always shows the latest." : 'Order-by dates are on the site.'} Prices include VAT and UK delivery. Snickerdoodle is a trading name of Launch Mode Ltd, 124 City Road, London EC1V 2NX. Please pass this on or recycle it.`;

const PRODUCTS = XMAS
  ? [['mug-tree.jpg', 'mug', '£18'], ['cards-hanging.jpg', 'cards', '£5.50'], ['wrapping-paper.jpg', 'wrapping paper', '£23'], ['calendar.jpg', '2027 calendar', '£22']]
  // spring: other drawings than the one on the front, to show any drawing works
  : [['card-castle.jpg', 'card', '£5.50', 1.7], ['mug-truck.jpg', 'mug', '£18', 1.55], ['cushion-flower.jpg', 'heart cushion', '£22', 1.45], ['jigsaw-digger.jpg', 'jigsaw', '£26', 1.4]];

// ---------- FRONT ----------
function front() {
  const bgSize = S('64mm', '82mm');
  let html = `<section class="side front" style="background-image:url(${img(PAPER_FRONT)});background-size:${bgSize}">`;
  if (SIZE === 'a6') {
    html += `
      <div class="abs logo-tag" style="left:8mm;top:8mm;width:33mm;padding:1.4mm 2.2mm;transform:rotate(-2deg)"><span class="tape sky" style="width:12mm;margin-left:-6mm"></span><img src="${img(LOGO)}" alt="snickerdoodle"></div>
      <h1 class="abs" style="left:8mm;top:26mm;width:96mm;font-size:27pt">Their drawing,<br>on your tree.</h1>
      <div class="abs sheet" style="left:8.5mm;top:55mm;width:41mm;height:51mm;transform:rotate(-6deg)"><span class="tape honey"></span><img src="${img('sketch-robin.jpg')}" alt=""></div>
      <p class="abs hand over" style="left:52mm;top:46.5mm;font-size:15pt;color:var(--tomato);transform:rotate(-5deg)">made real!</p>
      <div class="abs over" style="left:38mm;top:50mm">${arrow(16, 10, 10)}</div>
      <div class="abs photo" style="left:47mm;top:61mm;width:56mm;height:56mm;transform:rotate(3deg)"><span class="tape berry" style="transform:rotate(-4deg)"></span><img src="${img('robin-ornament.jpg')}" alt=""></div>
      <div class="abs tag" style="left:36mm;top:110.5mm;transform:rotate(-3deg)"><p class="t" style="font-size:12.5pt">the robin they drew</p><p class="s" style="font-size:5.6pt">ceramic ornament · £21</p></div>
      <p class="abs" style="left:8mm;top:124.5mm;width:66mm;font-weight:800;font-size:9pt;line-height:1.2">Christmas baubles from £19<br>Free UK delivery · snickerdoodle.co.uk</p>
      <span class="abs pill tomato" style="left:8mm;top:135.5mm;font-size:9.6pt;padding:1.6mm 3.6mm">order by sat 12 dec</span>
      ${frontQr(80, 120.5, 23, 6.4)}`;
  } else if (XMAS) {
    html += `
      <div class="abs logo-tag" style="left:8mm;top:8.5mm;width:44mm;padding:1.8mm 2.8mm;transform:rotate(-2deg)"><span class="tape sky" style="width:15mm;margin-left:-7.5mm"></span><img src="${img(LOGO)}" alt="snickerdoodle"></div>
      <span class="abs pill ink" style="right:8mm;top:13mm;font-size:8.4pt;padding:1.4mm 3.4mm">${icon('heart', 3.4, '#FFFBF2')} for the grown-ups</span>
      <h1 class="abs" style="left:8mm;top:32mm;width:136mm;font-size:41pt">Their drawing,<br>on your tree.</h1>
      <p class="abs" style="left:8mm;top:66mm;width:128mm;font-size:10.8pt;font-weight:500">Snap one of their drawings on your phone and see it on an ornament, cards, a mug and more, in seconds. Made in the UK, delivered free.</p>
      <div class="abs sheet" style="left:10mm;top:91mm;width:56mm;height:69.5mm;transform:rotate(-6deg)"><span class="tape honey"></span><img src="${img('sketch-robin.jpg')}" alt=""></div>
      <p class="abs hand over" style="left:74mm;top:80mm;font-size:20pt;color:var(--tomato);transform:rotate(-5deg)">made real!</p>
      <div class="abs over" style="left:52mm;top:84mm">${arrow(22, 13, 10)}</div>
      <div class="abs photo" style="left:69mm;top:97mm;width:75mm;height:75mm;transform:rotate(3deg)"><span class="tape berry" style="transform:rotate(-4deg)"></span><img src="${img('robin-ornament.jpg')}" alt=""></div>
      <div class="abs tag" style="left:52mm;top:165mm;transform:rotate(-3deg)"><p class="t" style="font-size:16pt">the robin they drew</p><p class="s" style="font-size:6.6pt">ceramic ornament · £21</p></div>
      <p class="abs" style="left:8mm;top:184mm;width:100mm;font-weight:800;font-size:10.5pt;line-height:1.22">Christmas baubles from £19<br>Free UK delivery · snickerdoodle.co.uk</p>
      <span class="abs pill tomato" style="left:8mm;top:197.5mm;font-size:11pt;padding:1.8mm 4.2mm">order by sat 12 dec</span>
      ${frontQr(116, 176, 30, 7.6)}`;
  } else {
    html += `
      <div class="abs logo-tag" style="left:8mm;top:8.5mm;width:44mm;padding:1.8mm 2.8mm;transform:rotate(-2deg)"><span class="tape sky" style="width:15mm;margin-left:-7.5mm"></span><img src="${img(LOGO)}" alt="snickerdoodle"></div>
      <span class="abs pill ink" style="right:8mm;top:13mm;font-size:8.4pt;padding:1.4mm 3.4mm">${icon('heart', 3.4, '#FFFBF2')} for the grown-ups</span>
      <h1 class="abs" style="left:8mm;top:32mm;width:136mm;font-size:41pt">Mother's Day,<br>drawn by them.</h1>
      <p class="abs" style="left:8mm;top:66mm;width:128mm;font-size:10.8pt;font-weight:500">Snap a drawing from this book bag and see it on a card, a mug, a cushion and more, in seconds. Made in the UK, delivered free.</p>
      <div class="abs sheet" style="left:9mm;top:92mm;width:58mm;height:58mm;transform:rotate(-5deg)"><span class="tape sky"></span><img src="${img('range-drawing.jpg')}" alt=""></div>
      <div class="abs tag" style="left:12mm;top:145mm;transform:rotate(-4deg)"><p class="t" style="font-size:16pt">one drawing</p><p class="s" style="font-size:6.6pt">a whole family range</p></div>
      <p class="abs hand over" style="left:66mm;top:80mm;font-size:20pt;color:var(--tomato);transform:rotate(-5deg)">made real!</p>
      <div class="abs over" style="left:58mm;top:88mm">${arrow(22, 13, 12)}</div>
      <img class="abs cutout" src="${img('range-framed.png')}" alt="" style="left:84mm;top:92mm;width:58mm;transform:rotate(3deg)">
      <img class="abs cutout" src="${img('range-card.png')}" alt="" style="left:70mm;top:128mm;width:38mm;transform:rotate(-5deg)">
      <img class="abs cutout" src="${img('range-cushion.png')}" alt="" style="left:104mm;top:132mm;width:42mm;transform:rotate(4deg)">
      <div class="abs photo" style="left:76mm;top:150mm;width:28mm;height:28mm;transform:rotate(-3deg);padding:1mm"><img src="${img('range-mug.jpg')}" alt=""></div>
      <p class="abs" style="left:8mm;top:184mm;width:104mm;font-weight:800;font-size:10.5pt;line-height:1.22">Cards £5.50 · mugs £18 · cushions £22<br>Free UK delivery · snickerdoodle.co.uk</p>
      <span class="abs pill tomato" style="left:8mm;top:197.5mm;font-size:11pt;padding:1.8mm 4.2mm">mother's day: sun 7 march</span>
      ${frontQr(116, 176, 30, 7.6)}`;
  }
  return html + proof() + '</section>';
}

// ---------- BACK ----------
function back() {
  const bgSize = S('64mm', '82mm');
  let html = `<section class="side back" style="background-image:url(${img(PAPER_BACK)});background-size:${bgSize}">`;
  const thumbs = (w, cap) => PRODUCTS.map(([f, n, p, z = 1]) => `<div class="thumb" style="width:${w}mm"><div class="im"><div style="overflow:hidden"><img src="${img(f)}" alt="" style="transform:scale(${z})"></div></div><p class="cap" style="font-size:${cap}pt">${n} <b>${p}</b></p></div>`).join('');
  const lead = XMAS ? 'Try it with their drawing, free.' : 'For the drawings in this book bag.';
  const sub = XMAS
    ? 'Snap it on your phone and see it on an ornament, cards, a mug and more in seconds. No account. No posting the original.'
    : 'Try any of them on a card, mug or cushion, free, in seconds. Then keep every one in a private keepsake box, just for your family.';
  const coupon = (fs, pad, codefs) => `<div class="coupon" style="padding:${pad}"><p style="font-size:${fs}pt;font-weight:800">First order? <span style="color:var(--tomato)">Your first card's on us.</span></p><span class="code" style="font-size:${codefs}pt;padding:.6mm 2mm">${CODE}</span></div>`;
  const dates = XMAS ? 'cards by <b>thu 10 dec</b> · gifts by <b>sat 12 dec</b>' : "mother's day is <b>sun 7 march</b>: order by the date on the site";

  if (SIZE === 'a6') {
    html += `
      <h2 class="abs" style="left:8mm;top:8.5mm;width:95mm;font-size:19pt">${lead}</h2>
      <p class="abs" style="left:8mm;top:18.5mm;width:94mm;font-size:8.4pt;color:var(--ink-soft)">${sub}</p>
      <div class="abs card" style="left:8mm;top:33mm;width:45mm;padding:3mm 3mm 2.4mm;text-align:center">
        <div style="width:39mm;height:39mm">${qr()}</div>
        <p style="font-size:8.6pt;font-weight:800;color:var(--tomato);margin-top:1.6mm;line-height:1.1">Scan to ${QR_PROMISE[0]}<br>${QR_PROMISE[1]}, in seconds</p>
        <p style="font-size:6.2pt;font-weight:700;margin-top:.8mm">or visit snickerdoodle.co.uk</p>
      </div>
      <p class="abs" style="left:57mm;top:32.5mm;font-size:8.6pt;font-weight:800">Also made real</p>
      <div class="abs" style="left:57mm;top:37.5mm;width:46mm;display:grid;grid-template-columns:1fr 1fr;gap:2.2mm 2.4mm">${thumbs(21.8, 6.2)}</div>
      <p class="abs line" style="left:8mm;top:97mm;width:96mm;font-size:8pt">${icon('gift', 3.8, '#C8402A')}<span>Share a ready-to-buy link so granny can treat them in a tap.</span></p>
      <div class="abs" style="left:8mm;top:104.5mm;width:95mm">${coupon(8.8, '2mm 2.4mm', 9.2)}</div>
      <p class="abs line" style="left:8mm;top:119mm;width:96mm;font-size:7.8pt">${icon('truck', 3.6, '#C8402A')}<span>${dates}</span></p>
      <p class="abs line" style="left:8mm;top:124.5mm;width:96mm;font-size:7.8pt">${icon('lock', 3.6, '#2B2118')}<span>Private by default. Nothing is ever public.</span></p>
      <p class="abs smallprint" style="left:8mm;top:132.5mm;width:95mm;font-size:5.3pt">${SMALL}</p>`;
  } else {
    const steps = [
      ['camera', 'Snap it', 'Photograph the drawing on your phone. The original stays on your fridge.'],
      ['sparkles', 'See it on everything', XMAS ? 'An ornament, cards, a mug, wrapping paper and more, in seconds.' : 'A card, a mug, a cushion, a print and more, in seconds.'],
      ['gift', XMAS ? 'Order or share' : 'Keep it or give it', XMAS ? 'Order in a few taps, or send granny a ready-to-buy link.' : 'Keep it in your private keepsake box, or order it as a gift.'],
    ].map(([ic, h, p], i) => `<div style="display:flex;gap:2.2mm"><span class="num" style="width:7mm;height:7mm;font-size:10.5pt">${i + 1}</span><div><h3 style="font-size:10.5pt">${h}</h3><p style="font-size:8.2pt;color:var(--ink-soft);margin-top:.6mm">${p}</p></div></div>`).join('');
    html += `
      <h2 class="abs" style="left:8mm;top:9mm;width:138mm;font-size:${XMAS ? 25 : 22.5}pt;white-space:nowrap">${lead}</h2>
      <p class="abs" style="left:8mm;top:21mm;width:130mm;font-size:10pt;color:var(--ink-soft)">${sub}</p>
      <div class="abs" style="left:8mm;top:36mm;width:138mm;display:grid;grid-template-columns:repeat(3,1fr);gap:4mm">${steps}</div>
      <div class="abs card" style="left:8mm;top:62mm;width:54mm;padding:4mm 4mm 3.4mm;text-align:center">
        <div style="width:46mm;height:46mm">${qr()}</div>
        <p style="font-size:10.4pt;font-weight:800;color:var(--tomato);margin-top:2mm;line-height:1.1">Scan to ${QR_PROMISE[0]}<br>${QR_PROMISE[1]}, in seconds</p>
        <p style="font-size:7.6pt;font-weight:700;margin-top:.8mm">or visit snickerdoodle.co.uk</p>
      </div>
      <p class="abs" style="left:72mm;top:61.5mm;font-size:10.5pt;font-weight:800">Also made real</p>
      <div class="abs" style="left:72mm;top:67.5mm;width:70mm;display:grid;grid-template-columns:1fr 1fr;gap:2.6mm 5mm">${thumbs(32, 7.8)}</div>
      <div class="abs box" style="left:8mm;top:149mm;width:138mm;padding:3mm 3.6mm;display:grid;grid-template-columns:1fr 1fr;gap:1.6mm 5mm">
        <h3 style="grid-column:1/-1;font-size:10.5pt;display:flex;align-items:center;gap:1.6mm">${icon('home', 4.4, '#C8402A')} What happens to their drawings</h3>
        <p style="font-size:8pt">${icon('lock', 3.6, '#2B2118')}<span>They live in your <b>private keepsake box</b>. Nothing is ever public.</span></p>
        <p style="font-size:8pt">${icon('heart', 3.6, '#2B2118')}<span>Only the family you invite can see them. You choose who.</span></p>
        <p style="font-size:8pt">${icon('trash', 3.6, '#2B2118')}<span>See, download or delete anything, any time.</span></p>
        <p style="font-size:8pt">${icon('shield-check', 3.6, '#2B2118')}<span>We never ask for a child's surname. First names only.</span></p>
      </div>
      <div class="abs" style="left:8mm;top:179.5mm;width:138mm">${coupon(10.5, '2mm 3mm', 11)}</div>
      <p class="abs line" style="left:8mm;top:193mm;width:138mm;font-size:8.8pt">${icon(XMAS ? 'truck' : 'heart', 4, '#C8402A')}<span>${dates}</span></p>
      <p class="abs smallprint" style="left:8mm;top:199mm;width:138mm;font-size:5.7pt">${SMALL}</p>`;
  }
  return html + proof() + '</section>';
}

window.__render = () => { document.getElementById('sheet').innerHTML = front() + back(); };
window.__render();
</script>
