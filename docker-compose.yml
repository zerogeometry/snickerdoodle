# Local dev infrastructure. Brings up the UK/EU-style Postgres the trust spine
# expects. Throwaway local credentials only — never used in any deployed
# environment (those come from the secret store). Start with:
#   docker compose up -d
# then apply the schema with `npm run db:migrate` (DATABASE_URL from .env).
services:
  db:
    image: postgres:16
    container_name: snickerdoodle-db
    environment:
      POSTGRES_USER: snickerdoodle
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: snickerdoodle
    # Host port 5544 to avoid clashing with any local Postgres on 5432.
    ports:
      - '5544:5432'
    volumes:
      - snickerdoodle-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U snickerdoodle -d snickerdoodle']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  snickerdoodle-pgdata:
