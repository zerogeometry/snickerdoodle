# Local dev infrastructure. Brings up the UK/EU-style Postgres the trust spine
# expects. Throwaway local credentials only — never used in any deployed
# environment (those come from the secret store). Start with:
#   docker compose up -d
# then apply the schema with `npm run db:migrate` (DATABASE_URL from .env).
services:
  db:
    image: postgres:16
    container_name: snickerdoodle-db
    environment:
      POSTGRES_USER: snickerdoodle
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: snickerdoodle
    # Host port 5544 to avoid clashing with any local Postgres on 5432.
    ports:
      - '5544:5432'
    volumes:
      - snickerdoodle-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U snickerdoodle -d snickerdoodle']
      interval: 3s
      timeout: 3s
      retries: 20

  # Private S3-compatible object store — stands in for the UK/EU private bucket.
  # No public policy is ever set; access is via short-lived signed URLs only.
  minio:
    image: minio/minio:latest
    container_name: snickerdoodle-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      # Throwaway LOCAL encryption key (MinIO's built-in KMS) so the production rule
      # "originals are always KMS-encrypted" runs for real locally — e2e sets
      # S3_KMS_KEY_ALIAS(_ORIGINALS)=snickerdoodle-local. Never used anywhere deployed.
      MINIO_KMS_SECRET_KEY: snickerdoodle-local:1LxBT5XnX65c/9F+OfmEcv7gXmhomiUQOKtpIlwgLTM=
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # web console
    volumes:
      - snickerdoodle-minio:/data

volumes:
  snickerdoodle-pgdata:
  snickerdoodle-minio:
