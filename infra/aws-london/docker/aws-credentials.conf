# Only if you send the box's logs to CloudWatch (runbook §7): lets Docker's awslogs driver use the
# box user's key. Install as /etc/systemd/system/docker.service.d/aws-credentials.conf, then:
#   sudo systemctl daemon-reload && sudo systemctl restart docker
[Service]
Environment=AWS_SHARED_CREDENTIALS_FILE=/root/.aws/credentials
Environment=AWS_PROFILE=snickerdoodle-box
